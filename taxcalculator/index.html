<!DOCTYPE html>
<html>
    <head>
        <script>
            //define a function. 
            function calculatetotax()
            {
                //set of statement that execute when called
                var purchaseamount = parseFloat(document.getElementById("purchaseamount").value);
                var tax = .0825;

                var tax = purchaseamount * tax;
                var total = purchaseamount + tax;
                //output
                document.getElementById("tax").value = tax.toFixed(2);
                document.getElementById("total").value = total.toFixed(2);

            }
        </script>
    </head>
    <body>
         <h2>Tax Calculator</h2>
         <form>
            <label for="purchaseamount">Purchase Amount:</label><br>
            <input type="text" id="purchaseamount" name="purchaseamount" value=""><br>

            <label for="tax">Tax (8.25%):</label><br>
            <input type="text" id="tax" name="tax" value="" disabled><br>
            
            <label for="total">Total:</label><br>
            <input type="text" id="total" name="total" value="" disabled><br>

            <input type="button" value="Click Here to Calculate" onclick="calculatetotax()">

         </form>

    </body>
</html>
