<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
        <title>Animal Quiz</title>
    </head>
    <body>
    <header>
        <h1>Animal Quiz</h1>
        <p>Welcome to the Animal Quiz!</p>
    </header>

    <section>
        <form>
            <!---Radio Buttons--->
            <fieldset>
                <legend>Which animal is known as the king of the jungle?</legend>
                <input type="radio" id="option1" name="animal">
                <label for="option1">Lion</label>

            <input type="radio" id="option2" name="animal">
            <label for="option2">Elephant</label>

            <input type="radio" id="option3" name="animal">
            <label for="option3">Bear</label>

            <input type="radio" id="option4" name="animal">
            <label for="option4">Tiger</label>
            </fieldset>
            
                <!---Check boxes--->
             <fieldset>
                    <legend>Select the animals that can fly:</legend>
                    <input type="checkbox" id="fly1" name="flying_animals" value="Bird">
                    <label for="fly1">Bird</label>

            <input type="checkbox" id="fly2" name="flying_animals" value="Bat">
            <label for="fly2">Bat</label>

            <input type="checkbox" id="fly3" name="flying_animals" value="Butterfly">
            <label for="fly3">Butterfly</label>

            <input type="checkbox" id="fly4" name="flying_animals" value="Ostrich">
            <label for="fly4">Ostrich</label>
            </fieldset>

            <!---Radio Buttons--->
            <fieldset>
                <legend>Which animal is famous for its slow movement?</legend>
                <input type="radio" id="option1" name="slow_animal">
                <label for="option1">Rabbit</label>

            <input type="radio" id="option2" name="slow_animal">
            <label for="option2">Cheetah</label>

            <input type="radio" id="option3" name="slow_animal">
            <label for="option3">Sloth</label>

            <input type="radio" id="option4" name="slow_animal">
            <label for="option4">Shark</label>
            </fieldset>
            <!---Check boxes--->
            <fieldset>
                <legend>Select the animals that live in the ocean:</legend>
                <input type="checkbox" id="ocean1" name="ocean_animals" value="Dolphin">
                <label for="ocean1">Dolphin</label>

            <input type="checkbox" id="ocean2" name="ocean_animals" value="Whale">
            <label for="ocean2">Whale</label>

            <input type="checkbox" id="ocean3" name="ocean_animals" value="Shark">
            <label for="ocean3">Shark</label>

            <input type="checkbox" id="ocean4" name="ocean_animals" value="Kangaroo">
            <label for="ocean4">Kangaroo</label>
            </fieldset>
        </form>
    </section>
    </body>

</html>
